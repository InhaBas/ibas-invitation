<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="format-detection" content="telephone=no" />
    <title>{{event.name}} | IBAS</title>
    <meta name="description" content="{{summary}}" />

    <!-- 공유 미리보기 (OG). og:url, og:image는 config.json의 site.url 기준 절대 URL로 생성된다 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{event.name}}에 초대합니다" />
    <meta property="og:description" content="{{summary}}" />
    <meta property="og:url" content="{{site.url}}" />
    <meta property="og:image" content="{{ogImageUrl}}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- 1. 행사명과 인사말 -->
      <section id="greeting">
        <header class="hero">
          <p class="eyebrow">Invitation</p>
          <h1>{{event.name}}</h1>
          <p class="hero-summary">
            <time datetime="{{datetime.start}}">{{startText}}</time>
          </p>
        </header>
        <div class="letter">
          <p class="letter-body">{{event.greeting}}</p>
          <p class="signature"><span>IBAS 회장</span> <strong>{{event.president}}</strong></p>
        </div>
      </section>

      <!-- 2. 일시 -->
      <section id="datetime" class="card" aria-labelledby="datetime-title">
        <h2 id="datetime-title">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18" /></svg>
          일시
        </h2>
        <p class="datetime-text">
          <time datetime="{{datetime.start}}">{{startText}}</time>
          <span class="nowrap"><span class="range" aria-label="부터">~</span> <time datetime="{{datetime.end}}">{{endText}}</time></span>
        </p>
      </section>

      <!-- 3. 장소와 오시는 길 -->
      <section id="location" class="card" aria-labelledby="location-title">
        <h2 id="location-title">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.5" /></svg>
          장소
        </h2>
        <p class="place">{{location.name}}</p>
        <address>{{location.address}}</address>
        <ul class="map-links">
          <li><a class="btn" href="{{location.naverMapUrl}}" target="_blank" rel="noopener">네이버 지도</a></li>
          <li><a class="btn" href="{{location.kakaoMapUrl}}" target="_blank" rel="noopener">카카오맵</a></li>
        </ul>
      </section>

      <!-- 4. 프로그램 순서 -->
      <section id="program" class="card" aria-labelledby="program-title">
        <h2 id="program-title">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
          프로그램
        </h2>
        <ol class="timeline">
{{programItems}}
        </ol>
      </section>

      <!-- 5. 문의처 -->
      <section id="contact" class="card" aria-labelledby="contact-title">
        <h2 id="contact-title">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" /></svg>
          문의
        </h2>
        <p class="contact-name">{{contact.name}}</p>
        <a class="btn btn-primary" href="tel:{{contact.phone}}">{{contact.phone}}</a>
      </section>
    </main>
  </body>
</html>
